# Netlify construit le site avec le générateur maison (Python, bibliothèque standard uniquement)
# et publie le dossier dist/.
[build]
  command = "python3 build.py"
  publish = "dist"

# Anciennes adresses des parcours (nommés « chemins » jusqu'au 10 nov. 2026)
[[redirects]]
  from = "/fr/chemin-epuisement"
  to = "/fr/parcours-epuisement"
  status = 301
[[redirects]]
  from = "/fr/chemin-epuisement.html"
  to = "/fr/parcours-epuisement"
  status = 301
